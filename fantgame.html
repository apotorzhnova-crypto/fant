<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Яркие вопросы</title>
<style>
:root {
/* Яркие цвета фона /
--bg-1: #FF2E63; / Малиновый /
--bg-2: #FA5B0F; / Оранжевый /
--bg-3: #21D5FB; / Электрик /
--bg-4: #50E3C2; / Бирюзовый /
--bg-5: #FF9F1C; / Янтарный /
--bg-6: #2EC4B6; / Морской зеленый /
--bg-7: #E84A5F; / Красный /
--bg-8: #8338EC; / Фиолетовый /
--bg-9: #FF6B6B; / Коралловый /
--bg-10: #4ECDC4; / Аквамарин */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg-1);
color: #ffffff; /* Белый текст по умолчанию для контраста */
height: 100vh;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
transition: background-color 0.4s ease;
position: relative;
}

.container {
width: 100%;
max-width: 480px;
text-align: center;
padding: 20px;
}

/* Главный экран */
#start-screen {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 10;
pointer-events: auto;
background: rgba(255, 255, 255, 0.95);
border-radius: 20px;
padding: 20px;
}

h1 {
font-size: 24px;
line-height: 1.3;
margin-bottom: 32px;
letter-spacing: 0.5px;
color: var(--bg-1);
text-shadow: none;
}

.btn-start {
background: var(--bg-1);
border: none;
color: white;
padding: 16px 32px;
border-radius: 50px;
font-weight: 600;
font-size: 18px;
cursor: pointer;
box-shadow: 0 10px 20px rgba(0,0,0,0.2);
transition: all 0.3s ease;
position: relative;
overflow: hidden;
}

.btn-start:hover, .btn-start:active {
transform: scale(1.03);
box-shadow: 0 8px 16px rgba(0,0,0,0.1);
filter: brightness(1.1);
}

/* Экран с вопросом */
#game-screen {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: none;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px 20px;
min-height: 100%;
z-index: 5;
}

#game-screen.active { display: flex; }

.question-card {
background: rgba(255,255,255,0.95);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
padding: 36px 24px;
border-radius: 24px;
max-width: 90%;
box-shadow: 0 12px 32px rgba(0,0,0,0.2);
transform: translateY(20px);
opacity: 0;
animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
text-align: center;
line-height: 1.5;
color: #333; /* Темный текст на белой карточке */
}

@keyframes fadeInUp {
to { transform: translateY(0); opacity: 1; }
}

.question-text {
font-size: 19px;
font-weight: 500;
color: #333;
}

/* Перекрытие для клика по экрану */
.tap-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
z-index: 20;
cursor: pointer;
}

/* Анимация перелистывания */
@keyframes slideOutLeft {
to { transform: translateX(-40px); opacity: 0; }
}
@keyframes slideInRight {
from { transform: translateX(40px); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}

.slide-out { animation: slideOutLeft 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.slide-in { animation: slideInRight 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

</style>
</head>
<body>

<div class="container">
<!-- Главный
