<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Яркие вопросы</title>
<style>
:root {
/* Палитра ярких цветов */
--color-1: #FF2E63;
--color-2: #FA5B0F;
--color-3: #21D5FB;
--color-4: #50E3C2;
--color-5: #FF9F1C;
--color-6: #2EC4B6;
--color-7: #E84A5F;
--color-8: #8338EC;
--color-9: #FF6B6B;
--color-10: #4ECDC4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
background-color: var(--color-1);
color: #ffffff;
height: 100vh;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
transition: background-color 0.4s ease;
position: relative;
}

.container {
width: 100%;
max-width: 480px;
text-align: center;
padding: 20px;
}

/* Экран старта */
#start-screen {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 10;
background: rgba(255, 255, 255, 0.95);
border-radius: 20px;
padding: 20px;
}

h1 {
font-size: 24px;
line-height: 1.3;
margin-bottom: 32px;
color: var(--color-1);
}

.btn-start {
background: var(--color-1);
border: none;
color: white;
padding: 16px 32px;
border-radius: 50px;
font-weight: 600;
font-size: 18px;
cursor: pointer;
box-shadow: 0 10px 20px rgba(0,0,0,0.2);
transition: transform 0.2s;
}

.btn-start:active { transform: scale(0.95); }

/* Экран игры */
#game-screen {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: none;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px 20px;
z-index: 5;
}

#game-screen.active { display: flex; }

.question-card {
background: rgba(255,255,255,0.95);
backdrop-filter: blur(10px);
padding: 40px 20px;
border-radius: 20px;
max-width: 90%;
box-shadow: 0 15px 30px rgba(0,0,0,0.2);
transform: scale(0.95);
opacity: 0;
animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
text-align: center;
line-height: 1.6;
color: #333;
}

@keyframes popIn {
to { transform: scale(1); opacity: 1; }
}

.question-text {
font-size: 19px;
font-weight: 500;
color: #333;
}

.tap-area {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
z-index: 20;
cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
<!-- Экран старта -->
<div id="start-screen">
<h1>Яркие вопросы!</h1>
<button class="btn-start" id="btn-start">Начать</button>
</div>

<!-- Экран игры -->
<div id="game-screen" class="container">
<div class="question-card" id="question-box">
<div class="question-text" id="current-question">Загрузка...</div>
</div>
<div class="tap-area" id="tap-area"></div>
</div>
</div>

<script>
const questions = [
"Какой самый нелепый лайфхак ты попробовала и до сих пор не понимаешь, зачем?",
"Расскажи про блюдо, которое ты гордо подала гостям, а потом тихонько выбросила, когда все ушли.",
"Если бы твоя жизнь была реалити-шоу, какой бы был слоган?",
"Какое слово ты постоянно произносишь с неправильным ударением, и не надо меня поправлять — я так привыкла.",
"Вспомни случай, когда ты хотела быть загадочной, а вышло просто подозрительно.",
"Если бы твои поисковые запросы стали сериалом, какой это был бы жанр?",
"Какой предмет гардероба ты носила, пока подруги не устроили тебе «интервенцию»?",
"Придумай рекламу для своего будильника: «Он не будит, он…»",
"Расскажи про самое смешное оправдание, которое ты выдала, чтобы не идти на встречу.",
"Если бы холодильник мог говорить, какую одну фразу он повторял бы каждый день?",
"Какое сочетание продуктов ты ела и до сих пор считаешь гениальным, хотя все морщатся?",
"Если бы ты могла стереть из памяти один свой танец на вечеринке — какой бы это был?",
"Какой самый странный комплимент тебе когда-либо делали?",
"Если бы твой плейлист был фильмом, кто бы в нём играл главную роль?",
"Расскажи про случай, когда ты перепутала чаты и отправила что-то не туда.",
"Если бы у твоей лени был титул, какой бы он был?",
"Какой бытовой прибор ты бы назвала своим духовным наставником?",
"Вспомни момент, когда ты сказала «я быстро», а прошло три часа.",
"Если бы тебе пришлось продавать свой старый свитер как люксовый предмет — что бы ты написала в описании?",
"Какой свой «секретный режим» ты включаешь, когда никто не видит?",
"Если бы флирт был видом спорта, какой у тебя был бы результат: бронза, серебро, «я случайно выиграла»?",
"Расскажи про свидание, которое началось идеально, а закончилось так, что теперь это семейная легенда.",
"Какой неловкий момент на первом свидании ты вспоминаешь и смеёшься только сейчас?",
"Если бы чувства можно было описать одним эмодзи, какой бы это был и почему?",
"Какой комплимент ты услышала и сначала подумала: «Это точно мне?»",
"Расскажи про случай, когда ты флиртовала, а человек вообще этого не заметил.",
"Если бы любовь была погодой, какая это была бы погода в первые две недели и на третьем месяце?",
"Какой самый неожиданный комплимент ты когда-либо делала незнакомцу?",
"Если бы ты писала письмо себе в прошлое про отношения, что бы ты написала одним предложением?",
"Какой «романтический провал» ты теперь вспоминаешь и думаешь: «Зато история хорошая».",
"Вспомни ситуацию, где ты пыталась кого-то впечатлить, а вышло наоборот.",
"Какой совет ты когда-то дала, а потом сама себе сказала: «Да кто ты такая, чтобы советовать?»",
"Если бы смелость была предметом, что бы это было: меч, чашка кофе или пушистые носки?",
"Какой один день из своей жизни ты бы повторила, если бы знала, что всё закончится хорошо?",
"Если бы интуиция была голосом в голове, какой актёр её бы озвучивал?",
"Какой свой страх ты бы отдала кому-то, если бы можно было?",
"Если бы можно было изменить только одну мелочь в своей жизни, что бы это было?",
"Какой свой «маленький бунт» ты устроила в последнее время?",
"Что тебя больше всего пугает в будущем, если честно?",
"Какой свой внутренний голос ты бы убавила на 50%?",
"Расскажи про момент, когда ты сказала «да», а всю дорогу думала: «Зачем я это сделала?»",
"Какой комплимент тебя скорее смутил, чем обрадовал?",
"Если бы все твои голосовые сообщения вдруг стали публичными, какое было бы самым стыдным?",
"Какой момент из прошлого ты бы перемотала назад и просто промолчала?",
"Какое «хочу» ты долго прятала, потому что звучало слишком смело?",
"Если бы на один день можно было стать кем угодно (не знаменитостью), кем бы ты стала и что бы сделала?",
"Какой один секрет ты бы взяла с собой в бункер, а какой оставила снаружи?",
"Если бы твоя неловкость имела запах — какой бы это был запах?",
"Придумай название для своего внутреннего диалога, будто это подкаст.",
"Если бы твоя жизнь была мемом, какой это был бы мем?",
"Какой свой провал ты теперь считаешь поворотным моментом?",
"Что ты давно хочешь сказать кому-то, но всё никак не скажешь?",
"Какой один комплимент ты бы хотела слышать каждый день?",
"Какой момент ты бы хотела остановить и прожить ещё раз?",
"Что ты ценишь в себе, но редко говоришь вслух?",
"Если бы ты могла отправить себе в прошлое одно сообщение, что бы там было?",
"Какой свой момент «я тогда была сильнее, чем думала» ты вспоминаешь?",
"Если бы дружба была напитком, какой бы это был напиток и почему?",
"Расскажи про подругу, с которой можно молчать 20 минут, и это самое комфортное молчание в мире.",
"Если бы вы с подругой открыли бизнес, что бы это было и кто за что отвечал?",
"Какой нелепый заговор вы строили в детстве?",
"Если бы вам дали миллион, но потратить надо было за 24 часа и только вместе, на что бы вы его спустили?",
"Какой случай из вашей дружбы звучит как выдумка, но это чистая правда?",
"Что ты никогда не скажешь своей маме, но спокойно обсуждаешь с подругами?",
"Если бы ваша дружба была фильмом, кто бы кого играл из актрис?",
"Какой «код дружбы» у вас с лучшей подругой (фраза, жест, взгляд, который понимают только вы)?",
"Если бы ты могла оставить одно правило для всех будущих посиделок, что бы это было?",
"Напиши одно слово благодарности этому вечеру.",
"Если бы этот вечер был песней, какой бы она была?",
"Напиши короткое пожелание для любой из подруг, не называя имени.",
"Расскажи про ситуацию, когда ты хотела выглядеть очень взрослой и серьёзной, а вышло как в комедии.",
"Если бы твоя усталость имела громкость в децибелах — сколько бы это было?",
"Придумай слоган для своих выходных: «Мои выходные — это…»",
"Какой самый абсурдный страх у тебя есть?",
"Если бы твоя мотивация была животным, кто бы это был: ленивец, гепард или хомяк в колесе?",
"Расскажи про покупку, которую ты сделала «на эмоциях» и до сих пор не знаешь, зачем.",
"Если бы твоя продуктивность была погодой, какой бы это был прогноз?",
"Какой один предмет ты бы взяла на необитаемый остров, потому что «а вдруг пригодится»?",
"Если бы твоя энергия сегодня была транспортом — какой это был бы транспорт?",
"Придумай три названия для своего настроения прямо сейчас.",
"Если бы отношения были блюдом, какое бы это было блюдо и на каком этапе готовки оно сейчас?",
"Расскажи про момент, когда ты поняла: «Я в этой ситуации вообще не обязана быть удобной».",
"Какой свой «стыдный плейлист» ты слушаешь, когда никто не видит?",
"Если бы свидание было погодой, какая бы это была погода: шторм, жара или лёгкий дождь?",
"Какой самый неловкий вопрос тебе когда-либо задавали на свидании?",
"Если бы флирт был напитком, какой бы это был коктейль и из чего он состоял?",
"Расскажи про случай, когда ты пыталась быть «загадочной и недоступной», а вышло «я просто молчу».",
"Если бы ревность была цветом, какой бы это был оттенок?",
"Какой один момент в отношениях ты бы вырезала, если бы могла редактировать, как фильм?",
"Если бы привязанность была предметом гардероба, что бы это было: шарф, кроссовки или пижама?",
"Расскажи про фантазию, которую ты никому не рассказывала, но она тебе нравится.",
"Если бы страсть была местом, куда бы ты туда поехала?",
"Какой жест или взгляд тебя моментально цепляет у другого человека?",
"Если бы влечение было песней, какой бы это был трек и на какой минуте он тебя «цепляет»?",
"Расскажи про момент, когда ты почувствовала себя невероятно желанной — что тогда происходило?",
"Если бы соблазнение было блюдом, какой бы рецепт ты составила?",
"Какой один элемент в человеке тебя заводит больше всего — не внешность, а что-то неуловимое.",
"Если бы романтика была временем суток, какое бы это было время и почему?",
"Расскажи про случай, когда тебя зацепило не словами, а каким-то маленьким действием.",
"Если бы желание можно было упаковать в подарок, что бы было внутри коробки?"
 ];

const backgrounds = [
"#FF2E63", "#FA5B0F", "#21D5FB", "#50E3C2", "#FF9F1C",
"#2EC4B6", "#E84A5F", "#8338EC", "#FF6B6B", "#4ECDC4"
 ];

let currentIndex = 0;
let shuffledQuestions = ;

const btnStart = document.getElementById('btn-start');
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const currentQuestion = document.getElementById('current-question');
const tapArea = document.getElementById('tap-area');
const body = document.body;

function shuffle(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

btnStart.addEventListener('click', () => {
startScreen.style.display = 'none';
gameScreen.classList.add('active');

shuffledQuestions = shuffle([...questions]);
currentIndex = 0;

function showNextQuestion() {
if (currentIndex >= shuffledQuestions.length) {
currentQuestion.innerText = "Вопросы закончились! 🎉 Ты молодец!";
body.style.backgroundColor = "#333";
currentQuestion.style.color = "#fff";
return;
}

// Меняем фон на яркий
const randomBg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
body.style.backgroundColor = randomBg;

// Просто меняем текст (без клонирования элементов — это убирает баги)
currentQuestion.innerText = shuffledQuestions[currentIndex];

// Лёгкая анимация карточки через CSS класс
const card = document.getElementById('question-box');
card.style.opacity = '0';
card.style.transform = 'scale(0.95)';

setTimeout(() => {
card.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
card.style.opacity = '1';
card.style.transform = 'scale(1)';
}, 50);

currentIndex++;
}

// Показываем первый вопрос
showNextQuestion();

tapArea.addEventListener('click', showNextQuestion);
});
</script>
</body>
</html>
